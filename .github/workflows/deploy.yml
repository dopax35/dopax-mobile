name: Deploy to Azure

# Checks run on every push and pull request. Deployment only ever happens from
# main, or when someone triggers it by hand.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'infra/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [prod, staging]
        default: staging

concurrency:
  # Never let two deployments race. A half-applied Bicep deployment competing
  # with another is how a database gets reprovisioned under a running study.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_LOCATION: israelcentral
  DOPAX_ENVIRONMENT: ${{ inputs.environment || 'prod' }}

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Backend lint and typecheck
        working-directory: backend
        run: |
          npm run lint
          npm run typecheck

      - name: Backend tests
        working-directory: backend
        # Testcontainers starts a real PostgreSQL; ubuntu-latest ships Docker.
        run: npm test

      - name: Install admin
        working-directory: admin
        run: npm ci

      - name: Admin lint and typecheck
        working-directory: admin
        run: |
          npm run lint
          npm run typecheck

  validate-infra:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile template
        # Catches template errors without needing Azure credentials, so it also
        # runs on pull requests from forks.
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Fail on any Bicep warning
        run: |
          if az bicep build --file infra/main.bicep --stdout 2>&1 >/dev/null | grep -q 'Warning'; then
            az bicep build --file infra/main.bicep --stdout 2>&1 >/dev/null
            echo "::error::Bicep emitted warnings"
            exit 1
          fi

  deploy:
    name: Build, push, deploy
    needs: [checks, validate-infra]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}
    permissions:
      # Federated credentials rather than a stored service principal secret.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve names
        id: names
        run: |
          echo "resource_group=dopax-${DOPAX_ENVIRONMENT}-rg" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy infrastructure
        id: infra
        run: |
          az deployment group create \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --template-file infra/main.bicep \
            --parameters \
              location="${AZURE_LOCATION}" \
              environment="${DOPAX_ENVIRONMENT}" \
              postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
              jwtSecret="${{ secrets.JWT_SECRET }}" \
              adminJwtSecret="${{ secrets.ADMIN_JWT_SECRET }}" \
              imageTag="${{ steps.names.outputs.tag }}" \
              deployApplications=false \
            --output none

          REGISTRY=$(az deployment group show \
            --resource-group "${{ steps.names.outputs.resource_group }}" --name main \
            --query properties.outputs.registryLoginServer.value -o tsv)
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "registry_name=${REGISTRY%%.*}" >> "$GITHUB_OUTPUT"

      - name: Sign in to the registry
        run: az acr login --name "${{ steps.infra.outputs.registry_name }}"

      - uses: docker/setup-buildx-action@v3

      # Container Apps runs amd64. Building for anything else produces an image
      # that pushes cleanly and then fails at start with an exec format error.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.infra.outputs.registry }}/dopax-backend:${{ steps.names.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend release task
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.infra.outputs.registry }}/dopax-backend-release:${{ steps.names.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: admin
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.infra.outputs.registry }}/dopax-admin:${{ steps.names.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy applications
        id: apps
        run: |
          az deployment group create \
            --resource-group "${{ steps.names.outputs.resource_group }}" \
            --template-file infra/main.bicep \
            --parameters \
              location="${AZURE_LOCATION}" \
              environment="${DOPAX_ENVIRONMENT}" \
              postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
              jwtSecret="${{ secrets.JWT_SECRET }}" \
              adminJwtSecret="${{ secrets.ADMIN_JWT_SECRET }}" \
              imageTag="${{ steps.names.outputs.tag }}" \
              deployApplications=true \
            --output none

          API=$(az deployment group show \
            --resource-group "${{ steps.names.outputs.resource_group }}" --name main \
            --query properties.outputs.apiUrl.value -o tsv)
          echo "api=${API}" >> "$GITHUB_OUTPUT"

      - name: Verify the deployment is live
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "${{ steps.apps.outputs.api }}/healthz" > /dev/null; then
              echo "healthy after ${attempt} attempt(s)"
              curl -fsS "${{ steps.apps.outputs.api }}/readyz" || true
              exit 0
            fi
            sleep 15
          done
          echo "::error::${{ steps.apps.outputs.api }}/healthz never responded"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed to ${DOPAX_ENVIRONMENT}"
            echo ""
            echo "- API: ${{ steps.apps.outputs.api }}"
            echo "- Image tag: \`${{ steps.names.outputs.tag }}\`"
            echo ""
            echo "The R5 data bootstrap is **not** run automatically. Start it"
            echo "deliberately with \`az containerapp job start\` and watch it."
          } >> "$GITHUB_STEP_SUMMARY"
