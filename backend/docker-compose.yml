name: dopax-backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dopax
      POSTGRES_PASSWORD: dopax
      POSTGRES_DB: dopax
      # Deterministic collation so index ordering matches production regardless of host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # 55432 on the host. A native Postgres already holds 127.0.0.1:5432 and
      # wins over Docker's wildcard bind, so connections there would silently
      # land on the wrong database; 5433-5435 are taken by other containers.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dopax -d dopax"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dopax
      MINIO_ROOT_PASSWORD: dopaxdopax
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the buckets once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dopax dopaxdopax &&
      mc mb --ignore-existing local/dopax-uploads &&
      mc mb --ignore-existing local/dopax-exports &&
      echo 'buckets ready'
      "

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  pgdata:
  miniodata:
