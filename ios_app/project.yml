name: PDCollectiOS
options:
  bundleIdPrefix: com.pdcollect
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "10.20.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "7.0.0"

targets:
  PDCollectiOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PDCollectiOS
        type: group
        excludes:
          - "KeyboardExtension/**"
    info:
      path: PDCollectiOS/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.225458522869-ipigbhk8f1a3abgp3b4favs94g4f4hm5
        NSCameraUsageDescription: "This app uses the camera to scan documents"
        NSHealthShareUsageDescription: "This app uses Health data to monitor Parkinson's symptoms"
        NSHealthUpdateUsageDescription: "This app writes Health data to track Parkinson's symptoms"
        NSLocationWhenInUseUsageDescription: "PDCollect records movement and gait patterns in the background to analyze Parkinson's symptoms."
        NSLocationAlwaysAndWhenInUseUsageDescription: "PDCollect tracks continuous background location to maintain passive sensor collection for Parkinson's research."
        NSLocationAlwaysUsageDescription: "PDCollect tracks continuous background location to maintain passive sensor collection for Parkinson's research."
        NSMicrophoneUsageDescription: "This app records short voice samples of you reading a story aloud during the Voice Sample task, used to analyze speech patterns related to Parkinson's symptoms."
        NSBluetoothAlwaysUsageDescription: "This app connects to heart rate monitors and temperature sensors to track health metrics"
        NSBluetoothPeripheralUsageDescription: "This app connects to heart rate monitors and temperature sensors to track health metrics"
        UIRequiresFullScreen: true
        UILaunchStoryboardName: "Launch Screen"
        NSPrincipalClass: "$(PRODUCT_MODULE_NAME).LoggingApplication"
        NSMotionUsageDescription: "This app uses motion data to detect physical activity and monitor movement patterns"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - com.pdcollect.ios.bg-refresh
          - com.pdcollect.ios.bg-processing
        UIBackgroundModes:
          - fetch
          - processing
          - bluetooth-central
          - location
          - audio
    entitlements:
      path: PDCollectiOS/PDCollectiOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    scheme:
      testTargets:
        - PDCollectiOSTests
    dependencies:
      - package: ZIPFoundation
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFirestoreSwift
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: PDCollectKeyboard
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DISABLE_SENSORKIT
        GCC_PREPROCESSOR_DEFINITIONS:
          - "DISABLE_SENSORKIT=1"
          - "$(inherited)"
        SWIFT_OBJC_BRIDGING_HEADER: PDCollectiOS/PDCollectiOS-Bridging-Header.h
        OTHER_LDFLAGS:
          - "-weak_framework"
          - "SensorKit"
        PRODUCT_BUNDLE_IDENTIFIER: com.oriw.pdcollect.ios1
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        MARKETING_VERSION: 3.7.41
        CURRENT_PROJECT_VERSION: 129
        DEVELOPMENT_TEAM: YD2UPLT5JG
        INFOPLIST_FILE: PDCollectiOS/Info.plist
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          DEVELOPMENT_TEAM: YD2UPLT5JG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          DEVELOPMENT_TEAM: YD2UPLT5JG
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  # Unit tests — session/baseline domain logic (no UI, no device required)
  PDCollectiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PDCollectiOSTests
        type: group
    dependencies:
      - target: PDCollectiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oriw.pdcollect.ios1.tests
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        DEVELOPMENT_TEAM: YD2UPLT5JG
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  # Keyboard Extension — logs keystroke types (never actual characters)
  PDCollectKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PDCollectiOS/KeyboardExtension
        type: group
    info:
      path: PDCollectiOS/KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: PDCollect Keyboard
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
            Languages:
              - en-US
              - he
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
    entitlements:
      path: PDCollectiOS/KeyboardExtension/KeyboardExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oriw.pdcollect.ios1.keyboard
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        DEVELOPMENT_TEAM: YD2UPLT5JG
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: PDCollectKeyboard
      configs:
        Debug:
          DEVELOPMENT_TEAM: YD2UPLT5JG
        Release:
          DEVELOPMENT_TEAM: YD2UPLT5JG
